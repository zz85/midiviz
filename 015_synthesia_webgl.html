<!DOCTYPE HTML>
<html>
<head>
  <script src="MidiConvert.js"></script>
  <script src="piano.js"></script>
  <script src="harpsichord.js"></script>
  <script src="electric_piano.js"></script>
  <script src="wavetable_piano.js"></script>
  <script src="fast_piano.js"></script>
  <script src="silent_piano.js"></script>
  <script src="organ.js"></script>
  <script src="playback_controls.js"></script>
  <style>
    body { margin: 0; background: #1a1a2e; overflow: hidden; }
    #controls { position: absolute; z-index: 10; padding: 10px; color: #fff; }
    #controls button { margin: 0 5px; padding: 5px 15px; }
    #piano { position: absolute; bottom: 0; display: flex; height: 120px; }
    .key { position: relative; border: 1px solid #333; box-sizing: border-box; }
    .key.white { width: calc(100vw / 52); height: 100%; background: linear-gradient(to bottom, #e8e8e8, #fff); }
    .key.black { width: calc(100vw / 52 * 0.6); height: 60%; background: linear-gradient(to bottom, #222, #000); 
                 margin-left: calc(-100vw / 52 * 0.3); margin-right: calc(-100vw / 52 * 0.3); z-index: 1; }
    .key.active.white { background: linear-gradient(to bottom, #4fc3f7, #81d4fa); }
    .key.active.black { background: linear-gradient(to bottom, #0288d1, #03a9f4); }
  </style>
</head>
<body>
  <div id="controls">
    <span id="playbackControls"></span>
    <label><input type="checkbox" id="particlesToggle" checked> Particles</label>
  </div>
  <canvas id="canvas"></canvas>
  <div id="piano"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl2');
    const pianoEl = document.getElementById('piano');
    
    let showParticles = true;
    const PIANO_HEIGHT = 120;
    const LOOK_AHEAD = 3;
    const keys = {};
    const blackPattern = [1,3,6,8,10];
    const particles = [];
    
    // Build piano keys
    for (let midi = 21; midi <= 108; midi++) {
      const isBlack = blackPattern.includes(midi % 12);
      const key = document.createElement('div');
      key.className = 'key ' + (isBlack ? 'black' : 'white');
      keys[midi] = key;
      pianoEl.appendChild(key);
    }
    
    // WebGL shaders
    const vsSource = `#version 300 es
      in vec2 aPos;
      in vec4 aColor;
      in float aGlow;
      uniform vec2 uResolution;
      out vec4 vColor;
      out float vGlow;
      void main() {
        vec2 clip = (aPos / uResolution) * 2.0 - 1.0;
        gl_Position = vec4(clip.x, -clip.y, 0, 1);
        vColor = aColor;
        vGlow = aGlow;
      }
    `;
    
    const fsSource = `#version 300 es
      precision mediump float;
      in vec4 vColor;
      in float vGlow;
      out vec4 fragColor;
      void main() {
        fragColor = vColor * (1.0 + vGlow * 0.5);
      }
    `;
    
    const particleVS = `#version 300 es
      in vec2 aPos;
      in vec4 aColor;
      in float aSize;
      uniform vec2 uResolution;
      out vec4 vColor;
      void main() {
        vec2 clip = (aPos / uResolution) * 2.0 - 1.0;
        gl_Position = vec4(clip.x, -clip.y, 0, 1);
        gl_PointSize = aSize;
        vColor = aColor;
      }
    `;
    
    const particleFS = `#version 300 es
      precision mediump float;
      in vec4 vColor;
      out vec4 fragColor;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = 1.0 - smoothstep(0.3, 0.5, length(c));
        fragColor = vec4(vColor.rgb, vColor.a * d);
      }
    `;
    
    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    }
    
    function createProgram(vs, fs) {
      const prog = gl.createProgram();
      gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      return prog;
    }
    
    const noteProgram = createProgram(vsSource, fsSource);
    const particleProgram = createProgram(particleVS, particleFS);
    
    // Note rendering buffers
    const noteVAO = gl.createVertexArray();
    const notePosBuffer = gl.createBuffer();
    const noteColorBuffer = gl.createBuffer();
    const noteGlowBuffer = gl.createBuffer();
    
    gl.bindVertexArray(noteVAO);
    const aPosLoc = gl.getAttribLocation(noteProgram, 'aPos');
    const aColorLoc = gl.getAttribLocation(noteProgram, 'aColor');
    const aGlowLoc = gl.getAttribLocation(noteProgram, 'aGlow');
    
    gl.bindBuffer(gl.ARRAY_BUFFER, notePosBuffer);
    gl.enableVertexAttribArray(aPosLoc);
    gl.vertexAttribPointer(aPosLoc, 2, gl.FLOAT, false, 0, 0);
    
    gl.bindBuffer(gl.ARRAY_BUFFER, noteColorBuffer);
    gl.enableVertexAttribArray(aColorLoc);
    gl.vertexAttribPointer(aColorLoc, 4, gl.FLOAT, false, 0, 0);
    
    gl.bindBuffer(gl.ARRAY_BUFFER, noteGlowBuffer);
    gl.enableVertexAttribArray(aGlowLoc);
    gl.vertexAttribPointer(aGlowLoc, 1, gl.FLOAT, false, 0, 0);
    
    // Particle buffers
    const particleVAO = gl.createVertexArray();
    const particlePosBuffer = gl.createBuffer();
    const particleColorBuffer = gl.createBuffer();
    const particleSizeBuffer = gl.createBuffer();
    
    gl.bindVertexArray(particleVAO);
    const pPosLoc = gl.getAttribLocation(particleProgram, 'aPos');
    const pColorLoc = gl.getAttribLocation(particleProgram, 'aColor');
    const pSizeLoc = gl.getAttribLocation(particleProgram, 'aSize');
    
    gl.bindBuffer(gl.ARRAY_BUFFER, particlePosBuffer);
    gl.enableVertexAttribArray(pPosLoc);
    gl.vertexAttribPointer(pPosLoc, 2, gl.FLOAT, false, 0, 0);
    
    gl.bindBuffer(gl.ARRAY_BUFFER, particleColorBuffer);
    gl.enableVertexAttribArray(pColorLoc);
    gl.vertexAttribPointer(pColorLoc, 4, gl.FLOAT, false, 0, 0);
    
    gl.bindBuffer(gl.ARRAY_BUFFER, particleSizeBuffer);
    gl.enableVertexAttribArray(pSizeLoc);
    gl.vertexAttribPointer(pSizeLoc, 1, gl.FLOAT, false, 0, 0);
    
    // Color parsing
    const colorCache = {};
    function parseColor(hex) {
      if (colorCache[hex]) return colorCache[hex];
      const r = parseInt(hex.slice(1,3), 16) / 255;
      const g = parseInt(hex.slice(3,5), 16) / 255;
      const b = parseInt(hex.slice(5,7), 16) / 255;
      return colorCache[hex] = [r, g, b, 1];
    }
    
    function midiToX(midi) {
      let whiteCount = 0;
      for (let m = 21; m < midi; m++) {
        if (!blackPattern.includes(m % 12)) whiteCount++;
      }
      const isBlack = blackPattern.includes(midi % 12);
      const whiteWidth = canvas.width / 52;
      return isBlack ? whiteCount * whiteWidth - whiteWidth * 0.15 : whiteCount * whiteWidth;
    }
    
    function noteWidth(midi) {
      const isBlack = blackPattern.includes(midi % 12);
      return (canvas.width / 52) * (isBlack ? 0.6 : 1);
    }
    
    function spawnParticles(midi, color) {
      const x = midiToX(midi) + noteWidth(midi) / 2;
      const y = canvas.height;
      const [r, g, b] = parseColor(color);
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: -Math.random() * 8 - 3,
          life: 1, r, g, b,
          size: Math.random() * 6 + 3
        });
      }
    }
    
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight - PIANO_HEIGHT;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.onresize = resize;
    
    const playback = new PlaybackControls({
      container: '#playbackControls',
      onNoteOn: (note, color) => {
        if (showParticles) spawnParticles(note.midi, color);
      },
      onLoad: () => { particles.length = 0; }
    });
    
    document.getElementById('particlesToggle').onchange = e => showParticles = e.target.checked;
    
    function render() {
      requestAnimationFrame(render);
      
      gl.clearColor(0.1, 0.1, 0.18, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      
      const { lapse, playing, allNotes } = playback;
      
      if (playing) {
        playback.update();
        updateParticles();
      }
      
      Object.values(keys).forEach(k => k.classList.remove('active'));
      
      // Build note geometry
      const positions = [];
      const colors = [];
      const glows = [];
      
      for (const note of allNotes) {
        const { midi, time, duration: dur, trackNo } = note;
        const startY = canvas.height - (time - lapse) * (canvas.height / LOOK_AHEAD);
        const endY = canvas.height - (time + dur - lapse) * (canvas.height / LOOK_AHEAD);
        
        if (startY < -100 || endY > canvas.height + 100) continue;
        
        const x = midiToX(midi) + 1;
        const w = noteWidth(midi) - 2;
        const h = Math.max(startY - endY, 4);
        const y = endY;
        
        if (time <= lapse && time + dur >= lapse) {
          keys[midi]?.classList.add('active');
        }
        
        const isHitting = startY >= canvas.height - 5 && endY <= canvas.height;
        const [r, g, b] = isHitting ? [1, 1, 1] : parseColor(playback.getNoteColor(trackNo));
        const glow = isHitting ? 1 : 0.3;
        
        // Two triangles per note
        positions.push(x, y, x + w, y, x, y + h, x + w, y, x + w, y + h, x, y + h);
        for (let i = 0; i < 6; i++) {
          colors.push(r, g, b, 1);
          glows.push(glow);
        }
      }
      
      // Draw notes
      if (positions.length) {
        gl.useProgram(noteProgram);
        gl.uniform2f(gl.getUniformLocation(noteProgram, 'uResolution'), canvas.width, canvas.height);
        
        gl.bindVertexArray(noteVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER, notePosBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, noteColorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, noteGlowBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(glows), gl.DYNAMIC_DRAW);
        
        gl.drawArrays(gl.TRIANGLES, 0, positions.length / 2);
      }
      
      // Draw particles
      if (showParticles && particles.length) {
        const pPos = [], pCol = [], pSize = [];
        for (const p of particles) {
          pPos.push(p.x, p.y);
          pCol.push(p.r, p.g, p.b, p.life);
          pSize.push(p.size * p.life * 2);
        }
        
        gl.useProgram(particleProgram);
        gl.uniform2f(gl.getUniformLocation(particleProgram, 'uResolution'), canvas.width, canvas.height);
        
        gl.bindVertexArray(particleVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER, particlePosBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pPos), gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleColorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pCol), gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleSizeBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pSize), gl.DYNAMIC_DRAW);
        
        gl.drawArrays(gl.POINTS, 0, particles.length);
      }
    }
    
    playback.loadMidi('entertainer.mid');
    render();
  </script>
</body>
</html>
