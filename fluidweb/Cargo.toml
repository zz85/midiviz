[package]
name = "fluidweb"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
oxisynth = ["dep:oxisynth"]
rustysynth = ["dep:rustysynth"]

[dependencies]
wasm-bindgen = "0.2"
tinyaudio = "2"
oxisynth = { version = "0.1", optional = true }
rustysynth = { version = "1", optional = true }
