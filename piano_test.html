<!DOCTYPE html>
<html>
<head>
  <title>Piano Test</title>
  <style>
    .keys { display: flex; }
    .key { width: 40px; height: 150px; border: 1px solid #000; background: #fff; cursor: pointer; }
    .key.black { width: 25px; height: 100px; background: #000; margin: 0 -12px; z-index: 1; }
    .key:active, .key.active { background: #ddd; }
    .key.black:active, .key.black.active { background: #333; }
  </style>
</head>
<body>
  <h3>Click keys or use keyboard (A-K = C4-C5, Z-M = C3-B3, 1-0 = C5-B5)</h3>
  <div id="display">MIDI: --</div>
  <div class="keys" id="keyboard"></div>
  <script src="piano.js"></script>
  <script>
    const piano = new Piano();
    const keyboard = document.getElementById('keyboard');
    const display = document.getElementById('display');
    const startMidi = 48; // C3
    const pattern = [0,1,0,1,0,0,1,0,1,0,1,0]; // white/black key pattern (one octave)
    const fullPattern = [...pattern, ...pattern, ...pattern, 0]; // 3 octaves + C6
    const keyMap = {
      'z':0,'s':1,'x':2,'d':3,'c':4,'v':5,'g':6,'b':7,'h':8,'n':9,'j':10,'m':11,
      'a':12,'w':13,'s':14,'e':15,'d':16,'f':17,'t':18,'g':19,'y':20,'h':21,'u':22,'j':23,'k':24,
      '1':24,'2':25,'3':26,'4':27,'5':28,'6':29,'7':30,'8':31,'9':32,'0':33
    };
    // Fix overlapping keys
    const keyMapFixed = {
      'z':0,'x':2,'c':4,'v':5,'b':7,'n':9,'m':11,
      'a':12,'w':13,'s':14,'e':15,'d':16,'f':17,'t':18,'g':19,'y':20,'h':21,'u':22,'j':23,'k':24,
      '1':24,'2':25,'3':26,'4':27,'5':28,'6':29,'7':30,'8':31,'9':32,'0':33
    };

    // Create keys
    fullPattern.forEach((isBlack, i) => {
      const key = document.createElement('div');
      key.className = 'key' + (isBlack ? ' black' : '');
      key.dataset.midi = startMidi + i;
      keyboard.appendChild(key);
    });

    const showMidi = midi => display.textContent = 'MIDI: ' + midi;

    // Mouse events
    keyboard.addEventListener('mousedown', e => {
      if (e.target.dataset.midi) {
        piano.resume();
        const midi = +e.target.dataset.midi;
        piano.noteOn(midi);
        showMidi(midi);
        e.target.classList.add('active');
      }
    });
    document.addEventListener('mouseup', () => {
      document.querySelectorAll('.key.active').forEach(k => {
        piano.noteOff(+k.dataset.midi);
        k.classList.remove('active');
      });
    });

    // Keyboard events
    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      const i = keyMapFixed[e.key.toLowerCase()];
      if (i !== undefined) {
        piano.resume();
        const midi = startMidi + i;
        piano.noteOn(midi);
        showMidi(midi);
      }
    });
    document.addEventListener('keyup', e => {
      const i = keyMapFixed[e.key.toLowerCase()];
      if (i !== undefined) piano.noteOff(startMidi + i);
    });
  </script>
</body>
</html>
