<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MidiViz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, sans-serif;
      background: #0a0a0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Visualization - the star */
    .viz {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #0a0a0f 0%, #0f0f18 100%);
    }

    .note {
      position: absolute;
      width: 1.8%;
      border-radius: 4px;
      background: linear-gradient(180deg, #818cf8, #6366f1);
      box-shadow: 0 0 20px rgba(99,102,241,0.4);
    }

    .playhead {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #6366f1;
      box-shadow: 0 0 30px #6366f1;
    }

    /* Piano - compact */
    .piano {
      display: flex;
      height: 80px;
      background: #111;
      padding: 4px 2px 0;
    }
    .key {
      position: relative;
    }
    .key.white {
      flex: 1;
      background: linear-gradient(180deg, #f5f5f5, #e0e0e0);
      margin: 0 0.5px;
      border-radius: 0 0 4px 4px;
    }
    .key.black {
      width: 1.2%;
      height: 55%;
      background: linear-gradient(180deg, #333, #111);
      margin-left: -0.6%;
      margin-right: -0.6%;
      z-index: 1;
      border-radius: 0 0 3px 3px;
    }
    .key.active.white {
      background: linear-gradient(180deg, #a5b4fc, #818cf8);
    }
    .key.active.black {
      background: linear-gradient(180deg, #6366f1, #4f46e5);
    }

    /* Controls - minimal bar */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: #111;
      border-top: 1px solid #222;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #6366f1;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover { background: #5558e3; }

    .progress {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time {
      font-size: 12px;
      color: #666;
      font-variant-numeric: tabular-nums;
      min-width: 40px;
    }
    .bar {
      flex: 1;
      height: 4px;
      background: #222;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .bar-fill {
      width: 35%;
      height: 100%;
      background: #6366f1;
      border-radius: 2px;
    }

    .song-select {
      padding: 8px 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      min-width: 180px;
    }

    .speed {
      padding: 6px 10px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 4px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="viz">
    <div class="note" style="left:30%; bottom:65%; height:70px;"></div>
    <div class="note" style="left:36%; bottom:40%; height:100px;"></div>
    <div class="note" style="left:44%; bottom:75%; height:50px;"></div>
    <div class="note" style="left:50%; bottom:20%; height:120px;"></div>
    <div class="note" style="left:58%; bottom:50%; height:80px;"></div>
    <div class="note" style="left:64%; bottom:30%; height:90px;"></div>
    <div class="playhead"></div>
  </div>

  <div class="piano" id="piano"></div>

  <div class="controls">
    <button class="play-btn">▶</button>
    <div class="progress">
      <span class="time">1:24</span>
      <div class="bar"><div class="bar-fill"></div></div>
      <span class="time">4:02</span>
    </div>
    <select class="song-select">
      <option>Golden Hour — JVKE</option>
      <option>Clair de Lune — Debussy</option>
      <option>River Flows in You — Yiruma</option>
      <option>Moonlight Sonata — Beethoven</option>
    </select>
    <select class="speed">
      <option>0.5x</option>
      <option>0.75x</option>
      <option selected>1x</option>
      <option>1.5x</option>
    </select>
  </div>

  <script>
    const piano = document.getElementById('piano');
    const blacks = [1,3,6,8,10];
    for (let m = 21; m <= 108; m++) {
      const k = document.createElement('div');
      k.className = 'key ' + (blacks.includes(m % 12) ? 'black' : 'white');
      if ([60,64,67].includes(m)) k.classList.add('active');
      piano.appendChild(k);
    }
  </script>
</body>
</html>
