<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI Player Mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      background: linear-gradient(90deg, #4fc3f7, #e91e63);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    select, button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    select:hover, button:hover { background: rgba(255,255,255,0.15); }
    select:focus, button:focus { outline: none; border-color: #4fc3f7; }

    .spacer { flex: 1; }

    /* Visualization area */
    .viz-area {
      position: relative;
      height: calc(100vh - 56px - 140px - 80px);
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
    }

    .viz-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 14px;
      gap: 8px;
    }

    /* Falling notes mockup */
    .note-block {
      position: absolute;
      border-radius: 4px;
      box-shadow: 0 0 20px currentColor;
    }

    /* Piano */
    .piano {
      display: flex;
      height: 140px;
      background: #111;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .key {
      position: relative;
      border-right: 1px solid #333;
    }
    .key.white {
      flex: 1;
      background: linear-gradient(180deg, #e8e8e8, #fff);
    }
    .key.black {
      width: 1.2%;
      height: 55%;
      background: linear-gradient(180deg, #333, #111);
      margin-left: -0.6%;
      margin-right: -0.6%;
      z-index: 1;
      border-radius: 0 0 4px 4px;
    }
    .key.white.active { background: linear-gradient(180deg, #4fc3f7, #81d4fa); }
    .key.black.active { background: linear-gradient(180deg, #0288d1, #03a9f4); }

    /* Bottom controls */
    .controls {
      padding: 16px 20px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .time {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.7);
      min-width: 45px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #e91e63);
      border-radius: 3px;
    }
    .progress-thumb {
      position: absolute;
      top: 50%;
      left: 35%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4fc3f7, #03a9f4);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .play-btn:hover { transform: scale(1.05); }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-left: 1px solid rgba(255,255,255,0.1);
    }
    .control-group:first-of-type { border-left: none; }

    .control-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      background: rgba(255,255,255,0.1);
      height: 4px;
      border-radius: 2px;
      width: 80px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .toggle input { display: none; }
    .toggle-switch {
      width: 32px;
      height: 18px;
      background: rgba(255,255,255,0.2);
      border-radius: 9px;
      position: relative;
      transition: background 0.2s;
    }
    .toggle input:checked + .toggle-switch { background: #4fc3f7; }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-switch::after { transform: translateX(14px); }

    /* Track toggles */
    .tracks {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .track-btn {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 12px;
    }
    .track-btn.t1 { border-color: #e91e63; color: #e91e63; }
    .track-btn.t2 { border-color: #3f51b5; color: #3f51b5; }
    .track-btn.t1.active { background: #e91e63; color: #fff; }
    .track-btn.t2.active { background: #3f51b5; color: #fff; }

    /* BPM display */
    .bpm {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">MidiViz</div>
    <select>
      <option>Load MIDI file...</option>
      <option selected>Golden Hour (JVKE)</option>
      <option>The Entertainer</option>
      <option>Clair de Lune</option>
    </select>
    <select>
      <option selected>SoundFont (OxiSynth)</option>
      <option>Wavetable Piano</option>
      <option>Electric Piano</option>
    </select>
    <select>
      <option selected>FluidR3 SF3</option>
      <option>Motif ES6 Concert Piano</option>
    </select>
    <span class="spacer"></span>
    <span class="bpm">♩ 120 BPM</span>
  </div>

  <div class="viz-area">
    <!-- Mockup falling notes -->
    <div class="note-block" style="left:30%; top:10%; width:1.5%; height:80px; background:#e91e63; color:#e91e63;"></div>
    <div class="note-block" style="left:35%; top:25%; width:1.5%; height:120px; background:#3f51b5; color:#3f51b5;"></div>
    <div class="note-block" style="left:42%; top:5%; width:1.5%; height:60px; background:#e91e63; color:#e91e63;"></div>
    <div class="note-block" style="left:50%; top:40%; width:1.5%; height:100px; background:#e91e63; color:#e91e63;"></div>
    <div class="note-block" style="left:55%; top:15%; width:1.5%; height:90px; background:#3f51b5; color:#3f51b5;"></div>
    <div class="note-block" style="left:62%; top:50%; width:1.5%; height:70px; background:#e91e63; color:#e91e63;"></div>
  </div>

  <div class="piano" id="piano"></div>

  <div class="controls">
    <div class="progress-row">
      <span class="time">1:24</span>
      <div class="progress-bar">
        <div class="progress-fill"></div>
        <div class="progress-thumb"></div>
      </div>
      <span class="time">4:02</span>
    </div>
    <div class="controls-row">
      <button class="play-btn">▶</button>
      
      <div class="control-group">
        <span class="control-label">Speed</span>
        <input type="range" value="50">
        <span style="font-size:12px">1.0x</span>
      </div>

      <div class="control-group">
        <span class="control-label">Y-Scale</span>
        <input type="range" value="50">
      </div>

      <div class="control-group">
        <label class="toggle"><input type="checkbox" checked><span class="toggle-switch"></span>Bloom</label>
        <label class="toggle"><input type="checkbox" checked><span class="toggle-switch"></span>Particles</label>
        <label class="toggle"><input type="checkbox" checked><span class="toggle-switch"></span>Preview</label>
      </div>

      <div class="tracks">
        <button class="track-btn t1 active">Track 1</button>
        <button class="track-btn t2 active">Track 2</button>
      </div>
    </div>
  </div>

  <script>
    // Generate piano keys
    const piano = document.getElementById('piano');
    const blackPattern = [1,3,6,8,10];
    for (let midi = 21; midi <= 108; midi++) {
      const isBlack = blackPattern.includes(midi % 12);
      const key = document.createElement('div');
      key.className = 'key ' + (isBlack ? 'black' : 'white');
      if ([60,64,67].includes(midi)) key.classList.add('active');
      piano.appendChild(key);
    }
  </script>
</body>
</html>
