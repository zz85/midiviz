<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MidiViz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0a0f;
      --bg2: #111;
      --border: #222;
      --text: #fff;
      --text2: #666;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.4);
      --note: linear-gradient(180deg, #818cf8, #6366f1);
      --key-white: linear-gradient(180deg, #f5f5f5, #e0e0e0);
      --key-black: linear-gradient(180deg, #333, #111);
      --key-active: linear-gradient(180deg, #a5b4fc, #818cf8);
    }

    [data-theme="light"] {
      --bg: #f5f5f5;
      --bg2: #fff;
      --border: #ddd;
      --text: #111;
      --text2: #888;
      --accent: #6366f1;
      --note: linear-gradient(180deg, #818cf8, #6366f1);
      --key-white: linear-gradient(180deg, #fff, #f0f0f0);
      --key-black: linear-gradient(180deg, #222, #111);
    }

    [data-theme="oled"] {
      --bg: #000;
      --bg2: #000;
      --border: #1a1a1a;
      --accent: #a855f7;
      --accent-glow: rgba(168,85,247,0.5);
      --note: linear-gradient(180deg, #c084fc, #a855f7);
      --key-active: linear-gradient(180deg, #c084fc, #a855f7);
    }

    [data-theme="sepia"] {
      --bg: #1a1814;
      --bg2: #242018;
      --border: #3a3428;
      --text: #e8dcc8;
      --text2: #8a7a60;
      --accent: #d4a056;
      --accent-glow: rgba(212,160,86,0.4);
      --note: linear-gradient(180deg, #e8b86a, #d4a056);
      --key-white: linear-gradient(180deg, #f5ead8, #e8dcc8);
      --key-active: linear-gradient(180deg, #e8c88a, #d4a056);
    }

    [data-theme="synthwave"] {
      --bg: #0f0a1a;
      --bg2: #1a1028;
      --border: #2a1a3a;
      --accent: #f472b6;
      --accent-glow: rgba(244,114,182,0.5);
      --note: linear-gradient(180deg, #f9a8d4, #f472b6);
      --key-active: linear-gradient(180deg, #67e8f9, #22d3ee);
    }

    [data-theme="forest"] {
      --bg: #0a120a;
      --bg2: #0f1a0f;
      --border: #1a2a1a;
      --accent: #4ade80;
      --accent-glow: rgba(74,222,128,0.4);
      --note: linear-gradient(180deg, #86efac, #4ade80);
      --key-active: linear-gradient(180deg, #86efac, #4ade80);
    }

    [data-theme="mono"] {
      --bg: #111;
      --bg2: #1a1a1a;
      --border: #333;
      --accent: #fff;
      --accent-glow: rgba(255,255,255,0.3);
      --note: linear-gradient(180deg, #eee, #aaa);
      --key-active: linear-gradient(180deg, #ddd, #aaa);
    }

    [data-theme="sunset"] {
      --bg: #0f1629;
      --bg2: #1a1f35;
      --border: #2a3050;
      --accent: #fb923c;
      --accent-glow: rgba(251,146,60,0.4);
      --note: linear-gradient(180deg, #fdba74, #fb923c);
      --key-active: linear-gradient(180deg, #fcd34d, #fb923c);
    }

    [data-theme="terminal"] {
      --bg: #0a0a0a;
      --bg2: #111;
      --border: #1a1a1a;
      --text: #22c55e;
      --text2: #166534;
      --accent: #22c55e;
      --accent-glow: rgba(34,197,94,0.5);
      --note: linear-gradient(180deg, #4ade80, #22c55e);
      --key-white: linear-gradient(180deg, #1a1a1a, #111);
      --key-black: linear-gradient(180deg, #0a0a0a, #000);
      --key-active: linear-gradient(180deg, #4ade80, #22c55e);
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    .viz {
      flex: 1;
      position: relative;
    }

    .note {
      position: absolute;
      width: 1.8%;
      border-radius: 4px;
      background: var(--note);
      box-shadow: 0 0 20px var(--accent-glow);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .playhead {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 30px var(--accent);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .piano {
      display: flex;
      height: 80px;
      background: var(--bg2);
      padding: 4px 2px 0;
      transition: background 0.3s;
    }
    .key { position: relative; transition: background 0.2s; }
    .key.white {
      flex: 1;
      background: var(--key-white);
      margin: 0 0.5px;
      border-radius: 0 0 4px 4px;
    }
    .key.black {
      width: 1.2%;
      height: 55%;
      background: var(--key-black);
      margin-left: -0.6%;
      margin-right: -0.6%;
      z-index: 1;
      border-radius: 0 0 3px 3px;
    }
    .key.active { background: var(--key-active); }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .progress {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time {
      font-size: 12px;
      color: var(--text2);
      font-variant-numeric: tabular-nums;
      min-width: 40px;
      transition: color 0.3s;
    }
    .bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .bar-fill {
      width: 35%;
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: background 0.3s;
    }

    select {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .theme-select { min-width: 120px; }
    .song-select { min-width: 180px; }
  </style>
</head>
<body data-theme="dark">
  <div class="viz">
    <div class="note" style="left:30%; bottom:65%; height:70px;"></div>
    <div class="note" style="left:36%; bottom:40%; height:100px;"></div>
    <div class="note" style="left:44%; bottom:75%; height:50px;"></div>
    <div class="note" style="left:50%; bottom:20%; height:120px;"></div>
    <div class="note" style="left:58%; bottom:50%; height:80px;"></div>
    <div class="note" style="left:64%; bottom:30%; height:90px;"></div>
    <div class="playhead"></div>
  </div>

  <div class="piano" id="piano"></div>

  <div class="controls">
    <button class="play-btn">▶</button>
    <div class="progress">
      <span class="time">1:24</span>
      <div class="bar"><div class="bar-fill"></div></div>
      <span class="time">4:02</span>
    </div>
    <select class="song-select">
      <option>Golden Hour — JVKE</option>
      <option>Clair de Lune — Debussy</option>
      <option>River Flows in You — Yiruma</option>
    </select>
    <select class="theme-select" onchange="document.body.dataset.theme=this.value">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="oled">OLED Black</option>
      <option value="sepia">Sepia</option>
      <option value="synthwave">Synthwave</option>
      <option value="forest">Forest</option>
      <option value="mono">Mono</option>
      <option value="sunset">Sunset</option>
      <option value="terminal">Terminal</option>
    </select>
  </div>

  <script>
    const piano = document.getElementById('piano');
    const blacks = [1,3,6,8,10];
    for (let m = 21; m <= 108; m++) {
      const k = document.createElement('div');
      k.className = 'key ' + (blacks.includes(m % 12) ? 'black' : 'white');
      if ([60,64,67].includes(m)) k.classList.add('active');
      piano.appendChild(k);
    }
  </script>
</body>
</html>
