<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pianist">
  <link rel="apple-touch-icon" href="pianist/icon-180.png">
  <title>Experiment #049 - Score Scan</title>
  <!--
    Experiment #049 - Score Scan: the #045 path-traced pianist playing the
    Goldberg Aria with the score over her, cut from a scan of the printed page
    (Bach-Gesellschaft edition, 1853, as IMSLP has it): the systems and barlines
    are found in the scan (sheet/scan.js), the system being played shows in a
    panel, the bar lit and a cursor in it, and the next system scrolls in. In
    exported videos too. See sheet/README.md.
  -->
  <script src="playback_controls.js"></script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    } }
  </script>
  <link rel="stylesheet" href="pathtrace/app.css">
</head>
<body>
  <script src="tonejs-midi.js"></script>
  <script type="module">
    import { boot } from './pathtrace/app.js'
    import { sheetPlugin } from './sheet/plugin.js'
    import { scanBuilder } from './sheet/scan-source.js'
    boot(sheetPlugin({ title: '#049 · Score Scan', defaultSong: 'midis/bach_goldberg_aria.mid', build: scanBuilder(), about: 'the printed page, sliced' }))
  </script>
</body>
</html>
