<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>#037 Violinist</title>
  <!--
    Experiment #037 - Violinist. An anime-style violinist (a VRoid CC0 VRM,
    cel shaded) plays the solo part of a violin MIDI on a concert stage, with
    the #033 fingering, left-hand and bow models driving a full-body rig
    (violinist/rig.js). The rest of the MIDI plays as accompaniment.
    See violinist/README.md.
  -->
  <script src="tonejs-midi.js"></script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 13px/1.35 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #eee; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; z-index: 5;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0)); transition: opacity 0.6s; }
    #top { top: 0; }
    #bottom { bottom: 0; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.6)); }
    body.idle .bar { opacity: 0; pointer-events: none; }
    select, button, input { font: inherit; color: #eee; background: rgba(30,30,36,0.8); border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 4px 8px; }
    button { cursor: pointer; }
    button.on { background: rgba(255, 190, 110, 0.25); }
    #seek { flex: 1; min-width: 160px; padding: 0; }
    a { color: #fc9; }
    #title { font-weight: 600; letter-spacing: 0.02em; }
    #status { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,0.6); z-index: 6; display: none; }
    #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; cursor: pointer;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.3), rgba(0,0,0,0.75)); transition: opacity 0.5s; }
    #start.gone { opacity: 0; pointer-events: none; }
    #start .play { width: 90px; height: 90px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; font-size: 36px; padding-left: 6px; box-sizing: border-box; }
    #credit { position: fixed; right: 12px; bottom: 44px; font-size: 11px; opacity: 0.55; z-index: 5; text-align: right; max-width: 50vw; }
    label { display: inline-flex; gap: 4px; align-items: center; }
  </style>
</head>
<body>
  <div id="top" class="bar">
    <a href="README.md" title="Experiments">◀</a>
    <span id="title">#037 Violinist</span>
    <select id="song" title="Piece"></select>
    <select id="model" title="Violinist">
      <option value="vroid-hairsample-male.vrm">Black hair (Chiaki-like)</option>
      <option value="vroid-sakurada-fumiriya.vrm">Light brown (Mine-like)</option>
      <option value="vroid-base-male.vrm">Short teal</option>
    </select>
    <select id="outfit" title="Outfit">
      <option value="concert">Black suit jacket</option>
      <option value="tails">Tailcoat</option>
      <option value="vest">Shirt, vest and tie</option>
      <option value="school">School uniform</option>
      <option value="casual">Casual: white hoodie</option>
      <option value="own">The model's own</option>
    </select>
    <select id="cam" title="Camera">
      <option value="auto">Director (auto)</option>
      <option value="front">From the audience</option>
      <option value="hall">Hall, wide</option>
      <option value="face">Face</option>
      <option value="hands">Left hand</option>
      <option value="bow">Bow and strings</option>
      <option value="left">From his left</option>
      <option value="low">Low, in front</option>
      <option value="behind">Over his shoulder</option>
      <option value="free">Free</option>
    </select>
    <select id="vsound" title="The violin's sound. GM: the soundfont below. #034's engines play the violin from the fingering, the bowing and the dynamics (and a recorded performer's pitch curves): the bowed waveguide and the Helmholtz source-filter are physical models running in real time; the hybrid sampler plays University of Iowa recordings along the same curves, rendered a few seconds ahead"><option value="gm">Violin: GM soundfont</option><option value="waveguide">Violin: bowed waveguide (#034)</option><option value="source">Violin: Helmholtz source-filter (#034)</option><option value="hybrid">Violin: hybrid sampler (#034)</option></select>
    <select id="sf" title="Soundfont (the accompaniment, and the violin when it is GM)">
      <option value="soundfonts/FluidR3.sf3">FluidR3 GM</option>
      <option value="soundfonts/Creative(emu10k1)8MBGMSFX.sf2">Creative 8 MB GM</option>
    </select>
    <select id="room" title="Room"></select>
    <select id="bowing" title="Which notes share a bow. Score: the slurs, marks and bowings of the Mutopia LilyPond source the MIDI was made from (violinist/scores). Herrmann / Auer (Bach's Sonatas and Partitas only): the slurs, marks and up- and down-bows of those printed editions, read from their IMSLP scans by optical music recognition (ScoreShift; violinist/editions), so with some misreadings. Inferred: slurs guessed from the music (strings/articulation.js). Fixed rule: up to 4 fast notes per bow"><option value="score">Bowing: score (Mutopia)</option><option value="edition:herrmann">Bowing: Herrmann ed., 1900 (IMSLP scan)</option><option value="edition:auer">Bowing: Auer ed., 1917 (IMSLP scan)</option><option value="infer">Bowing: inferred</option><option value="fixed">Bowing: fixed rule</option></select>
    <select id="notes" hidden title="What the violinist plays from. Score (the default): the Mutopia LilyPond source itself (violinist/scores, read by strings/lilypond.js): its notes, grace notes, slurs and marks, its dynamics and hairpins as loudness, and every staff of the accompaniment with its instrument. MIDI file: the MIDI LilyPond made from that source (violinist/midis), as before; the bowing still comes from the score"><option value="score">Notes: score (Mutopia source)</option><option value="midi">Notes: MIDI file</option></select>
    <select id="performer" hidden title="Play it as a real violinist did: the timing and dynamics of their recording (violinist/performances: the Bach Violin Dataset, and public-domain and CC recordings aligned to the score). Modelled (the default): the timing and dynamics a model predicts from the score, fitted on those recordings (strings/expression-model.js), for any piece. As written: the score's own timing and dynamics. With a recording of a concerto or the double concerto only the timing is taken, and the accompaniment follows it"></select>
    <label title="Ink outlines"><input type="checkbox" id="outline" checked> Ink</label>
  </div>
  <div id="bottom" class="bar">
    <button id="play">▶</button>
    <input type="range" id="seek" min="0" max="1" step="0.0001" value="0">
    <span id="time">0:00 / 0:00</span>
    <select id="speed" title="Speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select>
    <label title="Play the accompaniment"><input type="checkbox" id="accomp" checked> Accompaniment</label>
  </div>
  <div id="credit"></div>
  <div id="status"></div>
  <div id="start"><div class="play">▶</div><div id="startSong"></div></div>

  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { SoundFontEngine, MidiScheduler } from './soundfont-engine/src/index.js'
    import { installAcoustics, acousticParams, ROOMS } from './concertstage/acoustics.js'
    import { INSTRUMENTS, fingerLine, onePlayerNotes } from './strings/fingering.js'
    import { buildMotion } from './strings/motion.js'
    import { bowingFor } from './violinist/score-art.js'
    import { scorePiece, matchMidi, carryOver, enrichFromScore, bowScore } from './violinist/score-play.js'
    import { performersFor, applyPerformer, performerCredit, applyModelled, modelledCredit, MODELLED } from './violinist/performer.js'
    import { expressionFromCC } from './strings/sound/performance.js'
    import { tempoMapOf } from './strings/expression.js'
    import { buildViolin, buildBow } from './strings/violin3d.js'
    import { buildLeftHand, buildBowHand } from './strings/hand3d.js'
    import { createViolinistRig } from './violinist/rig.js'
    import { toonify, buildStage } from './violinist/stage.js'
    import { loadViolinist, disposeVRM, setOutline } from './violinist/character.js'

    const $ = id => document.getElementById(id)
    const Q = new URLSearchParams(location.search)
    const SHOT = Q.has('shot')
    const setStatus = (msg, ms = 0) => { $('status').textContent = msg; $('status').style.display = msg ? 'block' : 'none'; if (ms) setTimeout(() => setStatus(''), ms) }

    // ── Renderer, scene ────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: SHOT })
    renderer.setPixelRatio(Math.min(2, devicePixelRatio))
    renderer.setSize(innerWidth, innerHeight)
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFSoftShadowMap
    renderer.outputColorSpace = THREE.SRGBColorSpace
    document.body.appendChild(renderer.domElement)
    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 6000)
    camera.position.set(-40, 150, 340)
    const controls = new OrbitControls(camera, renderer.domElement)
    controls.target.set(10, 135, 0)
    controls.enableDamping = true
    const stage = buildStage(scene, renderer)

    // ── The instrument ─────────────────────────────────────────────────────
    const INST = INSTRUMENTS.violin
    const V = buildViolin(INST, { finish: 'red' })
    scene.add(V.group)
    const bow = buildBow()
    V.group.add(bow.group)
    const leftHand = buildLeftHand(V)            // not added to the scene: its solution drives the rig
    const bowHand = buildBowHand(bow, V.group)
    bowHand.hand.visible = false; bowHand.arm.visible = false
    const inkInstrument = toonify([V.group, bow.group])

    // ── The violinist (violinist/character.js) ─────────────────────────────
    let vrm = null, rig = null
    async function loadModel(file) {
      setStatus('Loading the violinist…')
      const next = await loadViolinist(file, { base: 'violinist/assets/models/', outfit: $('outfit').value })
      if (vrm) { scene.remove(vrm.scene); disposeVRM(vrm) }
      vrm = next
      scene.add(vrm.scene)
      vrm.scene.updateMatrixWorld(true)
      leftHand.setScale(1)
      rig = createViolinistRig({ vrm, V, bow, leftHand, bowHand })
      leftHand.setScale(rig.handScale)
      applyOutline()
      setStatus('')
    }
    $('outfit').onchange = async () => { await loadModel($('model').value); saveUrl() }
    function applyOutline() {
      const on = $('outline').checked
      inkInstrument.forEach(o => { o.visible = on })
      setOutline(vrm, on)
    }
    $('outline').onchange = applyOutline

    // ── Songs ──────────────────────────────────────────────────────────────
    const GROUPS = { 'bach-solo': 'Bach – Sonatas & Partitas (solo)', sonata: 'Violin sonatas', concerto: 'Concertos', showpiece: 'Showpieces' }
    const index = await (await fetch('violinist/midis/index.json')).json()
    for (const [g, label] of Object.entries(GROUPS)) {
      const og = document.createElement('optgroup'); og.label = label
      for (const e of index.filter(e => e.group === g)) og.appendChild(new Option(`${e.composer.replace('J. S. ', '')} – ${e.title.replace(/^.*?(BWV|Op\.|K\.|HWV|No\.)/, '$1')}`, e.file))
      $('song').appendChild(og)
    }
    $('song').value = Q.get('song') || 'bach_1006_1_preludio.mid'
    for (const [k, r] of Object.entries(ROOMS)) $('room').add(new Option(r.label, k, k === 'hall', k === 'hall'))

    const song = { entry: null, notes: [], accomp: [], motion: null, duration: 1, drive: null, programs: [], bowing: null }
    const notesCredit = (e, piece) => piece ? `Notes: the Mutopia score, read from its LilyPond source (${e.credit?.replace(/^Mutopia Project,?\s*/, '') || 'Mutopia Project'}), ${e.licence}` : `MIDI: ${e.credit || 'Mutopia Project'}, ${e.licence}`
    const bowingCredit = b => !b ? '' : b.edition ? `<br>Bowing: ${b.edition.title}, IMSLP #${b.edition.imslp}, read by OMR (${b.slurs} slurred notes, ${b.bows} bow signs)` : b.mode === 'score' ? `<br>Bowing: the Mutopia score (${b.slurs} slurred notes)` : b.mode === 'infer' ? `<br>Bowing: inferred (${b.slurs} slurred notes)` : ''
    async function loadSong(file) {
      const e = index.find(x => x.file === file) || index[0]
      setStatus('Fingering…')
      const midi = new Midi(await (await fetch('violinist/midis/' + e.file)).arrayBuffer())
      // tempo: many LilyPond files play at ♩=60; scale to a typical performance tempo
      const k = e.suggestedBpm && e.bpm ? e.bpm / e.suggestedBpm : 1
      // the solo track: by note count (tonejs splits a track at a program change, so try whole channels too)
      let solo = midi.tracks.filter(t => t.notes.length === e.violinNotes)
      if (solo.length !== 1) {
        const ch = [...new Set(midi.tracks.map(t => t.channel))].find(c => midi.tracks.filter(t => t.channel === c).reduce((a, t) => a + t.notes.length, 0) === e.violinNotes)
        solo = ch != null ? midi.tracks.filter(t => t.channel === ch) : [midi.tracks.reduce((b, t) => (t.notes.length > b.notes.length ? t : b))]
      }
      const ppq = midi.header.ppq
      const midiNotes = solo.flatMap(t => t.notes).map(n => ({ pitch: n.midi, on: n.time * k, off: (n.time + Math.max(0.04, n.duration)) * k, velocity: n.velocity, q: n.ticks / ppq, dq: n.durationTicks / ppq }))
        .sort((a, b) => a.on - b.on || a.pitch - b.pitch)
      // the score itself (violinist/score-play.js) unless the MIDI file is asked for
      $('notes').hidden = !e.score
      const piece = e.score && $('notes').value !== 'midi' ? await scorePiece(e) : null
      const scale = n => ({ ...n, on: n.on * k, off: n.off * k })
      const notes = piece ? piece.violin.map(scale) : midiNotes
      // a recorded performer (violinist/performer.js): their timing and dynamics; the rest follows below
      await showPerformers(e.file)
      const others = midi.tracks.filter(t => !solo.includes(t) && t.notes.length)
      const accNotes = piece
        ? piece.others.flatMap(p => p.notes.map(n => ({ ...scale(n), program: n.program, part: p.name })))
        : others.flatMap(t => t.notes.map(n => ({ t, n, q: n.ticks / ppq, dq: n.durationTicks / ppq, on: n.time * k, off: (n.time + Math.max(0.04, n.duration)) * k })))
      song.performer = null; song.modelled = null
      if ($('performer').value && $('performer').value !== MODELLED) {
        // recordings are aligned to the MIDI file's notes: played on those, then carried
        // to the score's notes that pair with them (the others along the recording's tempo map)
        try { song.performer = await applyPerformer($('performer').value, midiNotes, accNotes, { engine: $('vsound').value }) } catch (err) { console.warn('performer:', err.message) }
        if (song.performer && piece) carryOver(matchMidi(midiNotes, notes), notes, { timing: tempoMapOf(song.performer.rec, midiNotes) })
        if (song.performer) notes.sort((a, b) => a.on - b.on || a.pitch - b.pitch)
      }
      // the bow: the score's own slurs and marks by default (violinist/score-art.js on the MIDI)
      song.bowing = piece ? await bowScore(e, notes, midiNotes, $('bowing').value) : await bowingFor(e, notes, $('bowing').value)
      // the modelled performer (strings/expression-model.js): timing and dynamics from the score,
      // the accompaniment along its tempo
      if ($('performer').value === MODELLED) {
        const sp = piece || (e.score ? await scorePiece(e) : null)
        if (!piece && sp) enrichFromScore(notes, sp.violin)
        try { song.modelled = await applyModelled(notes, accNotes, { sections: sp?.sections || [] }) } catch (err) { console.warn('expression model:', err.message) }
      }
      fingerLine(notes, { instrument: 'violin' })
      // accompaniment: every other track (or staff) on its own channel and program
      const programs = [[0, 40]]
      const accomp = []
      let ch = 1
      const chOf = new Map()
      const channelFor = (key, program) => {
        if (!chOf.has(key)) { const c = key === 'drums' ? 9 : (ch === 9 ? ++ch : ch); chOf.set(key, c); if (c !== 9) { programs.push([c, program]); ch = Math.min(15, c + 1) } }
        return chOf.get(key)
      }
      if (piece) for (const a of accNotes) accomp.push({ midi: a.pitch, time: a.on, duration: Math.max(0.04, a.off - a.on), velocity: (a.velocity ?? 0.7) * 0.8, channel: channelFor(`p${a.program}`, a.program) })
      else for (const t of others) {
        const c = channelFor(t.channel === 9 ? 'drums' : `${t.channel}:${t.instrument.number}`, accompProgram(t.instrument.number))
        for (const a of accNotes) if (a.t === t) accomp.push({ midi: a.n.midi, time: a.on, duration: Math.max(0.04, a.off - a.on), velocity: a.n.velocity * 0.8, channel: c })
      }
      accomp.sort((a, b) => a.time - b.time)
      // dynamics for #034's engines: the solo track's hairpins (CC11 / CC7 / CC2),
      // or the recorded performer's lane (corrected for that engine)
      // (file times to song times: × k, or along the recording's tempo map)
      const tmap = song.performer ? tempoMapOf(song.performer.rec, midiNotes) : null
      const qmap = song.modelled?.tmap ?? tmap
      const T = qmap ? sec => qmap(midi.header.secondsToTicks(sec) / ppq, sec * k) : sec => sec * k
      // (the score's own dynamics are in its notes' loudness already)
      let ex = piece ? null : expressionFromCC(solo[0].controlChanges)
      if (ex) ex.points = ex.points.map(([t, v]) => [T(t), v])
      if (song.performer?.expression) ex = song.performer.expression.recorded || !ex ? song.performer.expression : { ...ex, timing: true }
      if (song.modelled) ex = song.modelled.expression
      const playerNotes = onePlayerNotes(notes)
      Object.assign(song, { expr: ex, entry: e, piece, notes:playerNotes, accomp, programs, motion:buildMotion(playerNotes, { instrument:'violin' }) })
      song.duration = Math.max(...playerNotes.map(n => n.off), ...accomp.map(n => n.time + n.duration), 1)
      song.drive = drivers(playerNotes)
      window.__song = song
      $('credit').innerHTML = `${e.composer} – ${e.title}<br>${notesCredit(e, song.piece)}${bowingCredit(song.bowing)}${song.performer ? '<br>Played as ' + performerCredit(song.performer.rec, { pitch: violin.on }) : song.modelled ? '<br>Played as ' + modelledCredit(song.modelled.model) : ''}`
      $('startSong').textContent = `${e.composer} – ${e.title}`
      clock.t = 0
      setStatus('')
      if (scheduler) loadSchedule()
    }
    // a few GM programs in these files are not what the score asks for (see midis/README.md)
    const accompProgram = p => (p === 6 ? 48 : p === 69 ? 60 : p)

    /** Expression drivers from the solo notes: energy (density, register), breath before phrases. */
    function drivers(notes) {
      const step = 0.1, n = Math.ceil((notes.at(-1)?.off || 1) / step) + 20
      const dens = new Float32Array(n), reg = new Float32Array(n)
      for (const x of notes) { const i = Math.floor(x.on / step); for (let j = Math.max(0, i - 10); j < Math.min(n, i + 10); j++) { dens[j] += 1 - Math.abs(j - i) / 10; reg[j] += x.pitch } }
      const energy = new Float32Array(n)
      for (let i = 0; i < n; i++) energy[i] = dens[i] ? Math.min(1, 0.35 * dens[i] / 6 + 0.65 * Math.max(0, (reg[i] / dens[i] - 62) / 26)) : 0.2
      const phrases = []
      let lastOff = -10
      for (const x of notes) { if (x.on - lastOff > 0.35) phrases.push(x.on); lastOff = Math.max(lastOff, x.off) }
      return {
        energy: t => energy[Math.max(0, Math.min(n - 1, Math.round(t / step)))],
        breath(t) {
          let b = 0
          for (const p of phrases) { if (p - t > 0.7) break; const d = t - p; b = Math.max(b, d < 0 ? Math.sin(Math.PI / 2 * (1 + d / 0.7)) : Math.max(0, 1 - d / 0.9)) }
          return b
        },
        phrases,
      }
    }

    // ── Sound ──────────────────────────────────────────────────────────────
    const hall = installAcoustics()
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    const engine = new SoundFontEngine({ backend: 'oxisynth', vendorPath: new URL('./vendor', import.meta.url).href, audioContext: audioCtx })
    let soundReady = false, soundLoading = null
    async function loadSound(v) {
      soundReady = false
      try { await engine.loadSoundFont(v); soundReady = true; setPrograms() } catch (e) { console.error(e); setStatus('Sound failed to load: ' + e.message, 4000) }
    }
    const ensureSound = () => (soundLoading ??= loadSound($('sf').value))
    $('sf').onchange = () => { soundLoading = loadSound($('sf').value) }
    const setPrograms = () => { if (soundReady) for (const [c, p] of song.programs) engine.programChange(c, p) }
    const applyHall = () => { const p = acousticParams({ room: $('room').value, seat: 'mid' }); hall.set(p); violin.lab?.setHall(p) }
    // #034's violin engines, in #034's Lab on its own audio context with the
    // same hall, started with the clock and put back in step when they drift.
    // Levels match the GM violin (as #038, measured on the Kreutzer finale)
    const LAB_LEVEL = { hybrid: 2.1, waveguide: 1.6, source: 1.1 }
    const violin = {
      lab: null, P: null, perfFor: null, exFor: null, speed: 0, using: null, checked: 0,
      get name() { return $('vsound').value },
      get on() { return this.name in LAB_LEVEL },
      async ensure() {
        if (!this.lab) {
          setStatus('Loading the violin engine…')
          const [{ Lab }, P] = await Promise.all([import('./strings/sound/engines.js'), import('./strings/sound/performance.js')])
          this.P = P
          this.lab = new Lab()
          this.lab.on(e => {
            if (e.engine !== this.using) return
            if (e.type === 'progress') setStatus(e.text)
            else if (e.type === 'ready') setStatus('')
            else if (e.type === 'error') setStatus('Violin: ' + e.message, 6000)
          })
          applyHall()
        }
        if (this.using !== this.name) { this.using = this.name; await this.lab.use(this.name) }
        this.lab.setVolume(LAB_LEVEL[this.name])
        if (this.perfFor !== song.notes || this.exFor !== song.expr || this.speed !== clock.speed) {
          this.perfFor = song.notes; this.exFor = song.expr; this.speed = clock.speed
          const P = this.P
          this.lab.setPerformance(P.renderPerformance(P.scaleNotes(song.notes, clock.speed), { instrument: 'violin', expression: P.scaleExpression(song.expr, clock.speed) }))
        }
        setStatus('')
      },
      // song time t (the Lab runs in performance time: song time / speed)
      start(t) { if (!this.lab) return; this.checked = performance.now(); if (this.lab.playing) this.lab.seek(t / clock.speed); else this.lab.play(t / clock.speed) },
      stop() { this.lab?.pause() },
      time() { return this.lab ? this.lab.time() * clock.speed : 0 },
    }
    $('room').onchange = applyHall
    applyHall()
    let scheduler = null
    const target = {
      audioContext: audioCtx, resume: () => audioCtx.resume(),
      noteOn(m, v, c) { if (soundReady && (c === 0 || $('accomp').checked)) engine.noteOn(m, v, c) },
      noteOff(m, c) { engine.noteOff(m, c) },
      controlChange(c, cc, v) { engine.controlChange(c, cc, v) },
      allSoundOff() { engine.allNotesOff?.() },
    }
    const clock = { playing: false, t: 0, wall: 0, speed: 1 }
    const now = () => clock.playing ? clock.t + (performance.now() - clock.wall) / 1000 * clock.speed : clock.t
    function loadSchedule() {
      const solo = onePlayerNotes(violin.on ? [] : song.notes).map(n => ({ midi: n.pitch, time: n.on, duration: n.off - n.on, velocity: n.velocity ?? 0.75, channel: 0 }))
      scheduler.load({ notes: [...solo, ...song.accomp].sort((a, b) => a.time - b.time), controlChanges: [] })
      setPrograms()
    }
    async function play() {
      if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {})
      await ensureSound()
      if (violin.on) await violin.ensure()
      if (!scheduler) {
        scheduler = new MidiScheduler(target); await scheduler.init()
        scheduler.on('time', t => { if (clock.playing && Math.abs(t - now()) > 0.08) { clock.t = t; clock.wall = performance.now() } })
      }
      loadSchedule()
      if (clock.t >= song.duration) clock.t = 0
      scheduler.speed = clock.speed
      scheduler.seek(clock.t); scheduler.play()
      if (violin.on) violin.start(clock.t)
      clock.wall = performance.now(); clock.playing = true
      $('play').textContent = '❚❚'; $('play').classList.add('on')
    }
    function pause() {
      clock.t = now(); clock.playing = false
      scheduler?.pause(); target.allSoundOff(); violin.stop()
      $('play').textContent = '▶'; $('play').classList.remove('on')
    }
    $('play').onclick = () => (clock.playing ? pause() : play())
    $('speed').onchange = () => {
      const was = clock.playing && violin.on
      if (was) pause()                                  // (#034's engines take new curves at the new speed)
      clock.t = now(); clock.wall = performance.now(); clock.speed = +$('speed').value; if (scheduler) scheduler.speed = clock.speed
      if (was) play()
    }
    $('seek').oninput = () => { clock.t = +$('seek').value * song.duration; clock.wall = performance.now(); if (clock.playing) { target.allSoundOff(); scheduler.seek(clock.t); if (violin.on) violin.start(clock.t) } }
    $('vsound').onchange = async () => {
      const was = clock.playing
      if (was) pause()
      // a recorded performer: the dynamics lane corrected for this engine (strings/expression.js)
      if (song.performer && !song.performer.rec.ensemble) { const t = clock.t; await loadSong($('song').value); clock.t = t }
      if (violin.on) await violin.ensure()
      if (scheduler) loadSchedule()
      if (was) play()
      saveUrl()
    }
    if ([...$('vsound').options].some(o => o.value === Q.get('violin'))) $('vsound').value = Q.get('violin')
    $('bowing').value = ['infer', 'fixed', 'edition:herrmann', 'edition:auer'].includes(Q.get('bowing')) ? Q.get('bowing') : 'score'
    // the editions cover Bach's solo works only
    const showEditions = () => { const solo = index.find(x => x.file === $('song').value)?.group === 'bach-solo'; for (const o of $('bowing').options) if (o.value.startsWith('edition:')) o.hidden = o.disabled = !solo; if (!solo && $('bowing').value.startsWith('edition:')) $('bowing').value = 'score' }
    showEditions()
    /** The Performer menu: the recordings of this piece (violinist/performances). */
    async function showPerformers(file) {
      const list = await performersFor(file)
      const want = $('performer').dataset.want ?? $('performer').value
      $('performer').innerHTML = '<option value="">Performer: as written</option><option value="model">Performer: modelled from recordings</option>' + list.map(p => `<option value="${p.rec}">Performer: ${p.violinist}${p.year ? ` (${p.year})` : ''}${p.ensemble ? ' – timing' : ''}</option>`).join('')
      // (the modelled performer unless as written was asked for, or a recording of this piece)
      $('performer').value = list.some(p => p.rec === want) ? want : want === '' ? '' : MODELLED
      delete $('performer').dataset.want
      $('performer').hidden = false
    }
    $('performer').dataset.want = Q.get('performer') === 'none' ? '' : Q.get('performer') || MODELLED
    $('performer').onchange = async () => { const was = clock.playing; pause(); await loadSong($('song').value); director.reset(); clock.t = 0; if (was) play(); saveUrl() }
    $('notes').value = Q.get('notes') === 'midi' ? 'midi' : 'score'
    $('notes').onchange = async () => { const was = clock.playing; pause(); await loadSong($('song').value); director.reset(); clock.t = 0; if (was) play(); saveUrl() }
    $('bowing').onchange = async () => { const was = clock.playing, t = clock.t; pause(); await loadSong($('song').value); clock.t = t; if (was) play(); saveUrl() }
    $('song').onchange = async () => { const was = clock.playing; pause(); showEditions(); await loadSong($('song').value); director.reset(); if (was) play(); saveUrl() }
    $('model').onchange = async () => { await loadModel($('model').value); saveUrl() }
    $('start').onclick = () => { $('start').classList.add('gone'); play() }
    addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('start').classList.add('gone'); clock.playing ? pause() : play() } })
    const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`

    // ── Cameras ────────────────────────────────────────────────────────────
    // [position, target, fov]; the violinist faces +z, his left (the scroll) at +x
    const VIEWS = {
      front: [[-40, 150, 340], [12, 132, 0], 30],
      hall: [[-60, 300, 1000], [0, 115, 0], 22],
      face: [[-25, 168, 95], [12, 152, 5], 30],
      hands: [[120, 165, 115], [38, 140, 30], 30],
      bow: [[-95, 160, 85], [8, 135, 22], 32],
      left: [[270, 150, 40], [10, 130, 10], 30],
      low: [[-70, 55, 250], [5, 140, 0], 32],
      behind: [[-80, 195, -150], [25, 138, 30], 32],
    }
    let tween = null
    function setView(v, cut = false) {
      const s = VIEWS[v]; if (!s) return
      const to = { pos: new THREE.Vector3(...s[0]), target: new THREE.Vector3(...s[1]), fov: s[2] }
      if (cut) { camera.position.copy(to.pos); controls.target.copy(to.target); camera.fov = to.fov; camera.updateProjectionMatrix(); tween = null; return }
      tween = { from: { pos: camera.position.clone(), target: controls.target.clone(), fov: camera.fov }, to, t: 0 }
    }
    // the director: cuts on phrase starts, every 6–12 s, slow drift within a take
    const director = {
      take: null, until: 0, last: '',
      reset() { this.take = null; this.until = 0 },
      update(t, dt) {
        if (!this.take || t >= this.until || t < this.start) {
          const opts = ['front', 'face', 'hands', 'bow', 'left', 'low', 'behind', 'hall', 'front', 'face'].filter(v => v !== this.last)
          const seed = Math.floor(t * 7.3 + (song.entry?.violinNotes || 0)) % 997
          const v = opts[(seed * 31 + 7) % opts.length]
          this.last = v; this.start = t
          let len = 6 + ((seed * 17) % 60) / 10
          const ph = song.drive?.phrases.find(p => p > t + len - 1.5 && p < t + len + 2.5)
          if (ph) len = ph - t
          this.until = t + len
          const s = VIEWS[v]
          this.take = { a: new THREE.Vector3(...s[0]), tg: new THREE.Vector3(...s[1]), fov: s[2], drift: new THREE.Vector3(((seed % 5) - 2) * 6, ((seed % 3) - 1) * 4, -10 - (seed % 4) * 4) }
        }
        const k = (t - this.start) / Math.max(1, this.until - this.start)
        camera.position.copy(this.take.a).addScaledVector(this.take.drift, k)
        controls.target.copy(this.take.tg)
        camera.fov = this.take.fov; camera.updateProjectionMatrix()
      },
    }
    $('cam').onchange = () => { if ($('cam').value !== 'auto') setView($('cam').value); saveUrl() }
    controls.addEventListener('start', () => { tween = null; if ($('cam').value === 'auto') $('cam').value = 'free' })

    function saveUrl() {
      if (SHOT) return
      const p = new URLSearchParams()
      if ($('song').value !== 'bach_1006_1_preludio.mid') p.set('song', $('song').value)
      if ($('model').selectedIndex) p.set('model', $('model').value)
      if ($('cam').value !== 'auto') p.set('view', $('cam').value)
      if ($('outfit').value !== 'concert') p.set('outfit', $('outfit').value)
      if ($('bowing').value !== 'score') p.set('bowing', $('bowing').value)
      if ($('notes').value === 'midi') p.set('notes', 'midi')
      if ($('performer').value !== MODELLED) p.set('performer', $('performer').value || 'none')
      if (violin.on) p.set('violin', violin.name)
      history.replaceState(null, '', '?' + p.toString())
    }
    if (Q.get('model')) $('model').value = Q.get('model')
    if (Q.get('outfit')) $('outfit').value = Q.get('outfit')
    if (Q.get('view')) $('cam').value = Q.get('view')

    // ── Load ───────────────────────────────────────────────────────────────
    await Promise.all([loadModel($('model').value), loadSong($('song').value)])
    if ($('cam').value !== 'auto') setView($('cam').value, true)
    if (!SHOT) ensureSound()

    // ── Loop ───────────────────────────────────────────────────────────────
    let idleT = performance.now()
    addEventListener('pointermove', () => { idleT = performance.now(); document.body.classList.remove('idle') })
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight) })
    function frame(t, dt) {
      const pose = song.motion?.poseAt(t)
      rig.update(pose, { t, energy: song.drive?.energy(t) ?? 0.4, breath: song.drive?.breath(t) ?? 0 }, dt)
      vrm.update(dt)
      if ($('cam').value === 'auto') director.update(t, dt)
      else if (tween) {
        tween.t = Math.min(1, tween.t + dt / 1.1)
        const e = tween.t < 0.5 ? 4 * tween.t ** 3 : 1 - (-2 * tween.t + 2) ** 3 / 2
        camera.position.lerpVectors(tween.from.pos, tween.to.pos, e)
        controls.target.lerpVectors(tween.from.target, tween.to.target, e)
        camera.fov = THREE.MathUtils.lerp(tween.from.fov, tween.to.fov, e); camera.updateProjectionMatrix()
        if (tween.t >= 1) tween = null
      }
      stage.update(t)
    }
    if (SHOT) {
      // headless: settle the springs over the second before t, then draw one frame
      const t = +(Q.get('t') || 5)
      $('start').style.display = 'none'
      for (let i = 60; i >= 0; i--) frame(t - i / 60, 1 / 60)
      controls.update()
      renderer.render(scene, camera)
      window.__info = { t, height: rig.height, handScale: rig.handScale }
      window.__dbg = { songDuration: song.duration, THREE, camera, controls, renderer, scene, rig, V, bow, vrm, leftHand, bowHand, frame }
      window.__done = true
    } else {
      const clk = new THREE.Clock()
      renderer.setAnimationLoop(() => {
        const dt = Math.min(0.05, clk.getDelta())
        let t = now()
        if (clock.playing && t > song.duration + 1) { pause(); clock.t = 0; t = 0 }
        // #034's violin plays on its own audio context: put it back in step if it drifts
        if (violin.on && clock.playing && violin.lab?.playing && performance.now() - violin.checked > 1000) {
          violin.checked = performance.now()
          if (Math.abs(violin.time() - t) > 0.06) violin.start(t)
        }
        frame(t, dt)
        controls.update()
        renderer.render(scene, camera)
        if (document.activeElement !== $('seek')) $('seek').value = Math.min(1, t / song.duration)
        $('time').textContent = `${fmt(Math.min(t, song.duration))} / ${fmt(song.duration)}`
        if (clock.playing && performance.now() - idleT > 3500) document.body.classList.add('idle')
      })
    }
  </script>
</body>
</html>
