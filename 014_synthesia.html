<!DOCTYPE HTML>
<html>
<head>
  <script src="MidiConvert.js"></script>
  <script src="piano.js"></script>
  <script src="harpsichord.js"></script>
  <script src="electric_piano.js"></script>
  <script src="wavetable_piano.js"></script>
  <script src="fast_piano.js"></script>
  <script src="silent_piano.js"></script>
  <script src="organ.js"></script>
  <script src="player.js"></script>
  <style>
    body { margin: 0; background: #1a1a2e; overflow: hidden; }
    #controls { position: absolute; z-index: 10; padding: 10px; color: #fff; }
    #controls button { margin: 0 5px; padding: 5px 15px; }
    #piano { position: absolute; bottom: 0; display: flex; height: 120px; }
    .key { position: relative; border: 1px solid #333; box-sizing: border-box; }
    .key.white { width: calc(100vw / 52); height: 100%; background: linear-gradient(to bottom, #e8e8e8, #fff); }
    .key.black { width: calc(100vw / 52 * 0.6); height: 60%; background: linear-gradient(to bottom, #222, #000); 
                 margin-left: calc(-100vw / 52 * 0.3); margin-right: calc(-100vw / 52 * 0.3); z-index: 1; }
    .key.active.white { background: linear-gradient(to bottom, #4fc3f7, #81d4fa); }
    .key.active.black { background: linear-gradient(to bottom, #0288d1, #03a9f4); }
  </style>
</head>
<body>
  <div id="controls">
    <select id="midiSelect" onchange="loadMidi(this.value)">
      <option value="rush_e_real.mid">Rush E</option>
      <option value="entertainer.mid">The Entertainer</option>
      <option value="minute_waltz.mid">Minute Waltz</option>
      <option value="Prelude1.mid">Prelude No.1</option>
      <option value="Fugue1.mid">Fugue No.1</option>
      <option value="chpn-p15.mid">Chopin Prelude 15</option>
      <option value="Knight-Rupert-Schumann.mid">Knight Rupert (Schumann)</option>
      <option value="rachmaninov3.mid">Rachmaninov 3</option>
      <option value="Toccata-and-Fugue-Dm.mid">Toccata and Fugue in D minor</option>
      <option value="hedwig_theme.mid">Hedwig's Theme (Harry Potter)</option>
    </select>
    <select id="instrumentSelect" onchange="switchInstrument(this.value)">
      <option value="piano">Piano</option>
      <option value="fast">Fast Piano (88-key)</option>
      <option value="wavetable">Wavetable Piano</option>
      <option value="electric">Electric Piano</option>
      <option value="harpsichord">Harpsichord</option>
      <option value="organ">Church Organ</option>
      <option value="silent">4'33" (Silent)</option>
    </select>
    <button onclick="instrument.resume(); player.play()">Play</button>
    <button onclick="player.pause()">Pause</button>
    <span id="time">0:00</span>
    <input id="progress" type="range" value="0" min="0" max="1" step="0.001" style="width:200px"
      onmousedown="seeking=true" onmouseup="player.seek(this.value*duration);lastPlayed=-1;seeking=false">
    Speed: <input type="range" value="1" min="0.2" max="10" step="0.1" style="width:100px" 
      onchange="player.speed(this.value)"><span id="speedVal">1x</span>
    <label><input type="checkbox" id="bloomToggle" checked onchange="bloom=this.checked"> Bloom</label>
    <label><input type="checkbox" id="particlesToggle" checked onchange="showParticles=this.checked"> Particles</label>
  </div>
  <canvas id="canvas"></canvas>
  <div id="piano"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pianoEl = document.getElementById('piano');
    
    let instrument, audioContext, allNotes = [], duration = 0, lastPlayed = -1, seeking = false, m = null;
    let bloom = true, showParticles = true;
    
    // Particle system
    const particles = [];
    
    function spawnParticles(midi, color) {
      const x = midiToX(midi) + noteWidth(midi) / 2;
      const y = canvas.height;
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: -Math.random() * 8 - 3,
          life: 1,
          color,
          size: Math.random() * 6 + 3
        });
      }
    }
    
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // gravity
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    
    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (bloom) {
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 15;
        }
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    const PIANO_HEIGHT = 120;
    const LOOK_AHEAD = 3; // seconds visible above piano
    const keys = {}; // midi -> element
    
    // Build 88-key piano (A0=21 to C8=108)
    const whitePattern = [0,2,4,5,7,9,11]; // C,D,E,F,G,A,B offsets
    const blackPattern = [1,3,6,8,10]; // C#,D#,F#,G#,A# offsets
    
    for (let midi = 21; midi <= 108; midi++) {
      const noteInOctave = midi % 12;
      const isBlack = blackPattern.includes(noteInOctave);
      const key = document.createElement('div');
      key.className = 'key ' + (isBlack ? 'black' : 'white');
      key.dataset.midi = midi;
      keys[midi] = key;
      pianoEl.appendChild(key);
    }
    
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight - PIANO_HEIGHT;
    }
    resize();
    window.onresize = resize;
    
    // Note colors by track
    const trackColors = ['#e91e63','#9c27b0','#3f51b5','#03a9f4','#009688','#8bc34a','#ffeb3b','#ff9800'];
    
    function midiToX(midi) {
      // Map midi 21-108 to screen width, accounting for black key positions
      let whiteCount = 0;
      for (let m = 21; m < midi; m++) {
        if (!blackPattern.includes(m % 12)) whiteCount++;
      }
      const isBlack = blackPattern.includes(midi % 12);
      const whiteWidth = canvas.width / 52;
      return isBlack ? whiteCount * whiteWidth - whiteWidth * 0.15 : whiteCount * whiteWidth;
    }
    
    function noteWidth(midi) {
      const isBlack = blackPattern.includes(midi % 12);
      return (canvas.width / 52) * (isBlack ? 0.6 : 1);
    }
    
    function render() {
      requestAnimationFrame(render);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw vertical grid lines for octaves (C) and E
      for (let midi = 24; midi <= 108; midi++) {
        const noteInOctave = midi % 12;
        if (noteInOctave === 0 || noteInOctave === 4) { // C or E
          const x = midiToX(midi);
          ctx.strokeStyle = noteInOctave === 0 ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)';
          ctx.lineWidth = noteInOctave === 0 ? 1.5 : 1;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
          // Octave label for C
          if (noteInOctave === 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '10px sans-serif';
            ctx.fillText('C' + (Math.floor(midi / 12) - 1), x + 3, canvas.height - 5);
          }
        }
      }
      
      // Draw horizontal measure lines (assuming 4/4 time, 120 BPM default)
      const bpm = m?.header?.bpm || 120;
      const beatsPerMeasure = m?.header?.timeSignature?.[0] || 4;
      const secondsPerMeasure = (60 / bpm) * beatsPerMeasure;
      const startMeasure = Math.floor((lapse - LOOK_AHEAD) / secondsPerMeasure);
      const endMeasure = Math.ceil((lapse + 1) / secondsPerMeasure);
      
      for (let measure = startMeasure; measure <= endMeasure; measure++) {
        if (measure < 0) continue;
        const measureTime = measure * secondsPerMeasure;
        const y = canvas.height - (measureTime - lapse) * (canvas.height / LOOK_AHEAD);
        if (y < 0 || y > canvas.height) continue;
        
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
        
        // Measure number
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '12px sans-serif';
        ctx.fillText(measure + 1, 5, y - 3);
      }
      
      if (playing) {
        player.update();
        updateParticles();
      }
      
      // Draw particles
      if (showParticles) drawParticles();
      
      if (!seeking) {
        document.getElementById('progress').value = lapse / duration;
        document.getElementById('time').textContent = Math.floor(lapse/60) + ':' + (lapse%60).toFixed(1).padStart(4,'0');
        document.getElementById('speedVal').textContent = speed.toFixed(1) + 'x';
      }
      
      // Reset all keys
      Object.values(keys).forEach(k => k.classList.remove('active'));
      
      // Draw and play notes
      for (let i = 0; i < allNotes.length; i++) {
        const note = allNotes[i];
        const { midi, time, duration: dur, velocity, trackNo } = note;
        
        // Play note (only when playing)
        if (playing && i > lastPlayed && time <= lapse) {
          if (time >= lapse - 0.05) {
            instrument.resume();
            instrument.noteOn(midi, velocity);
            if (showParticles) spawnParticles(midi, trackColors[trackNo % trackColors.length]);
            setTimeout(() => instrument.noteOff(midi), dur * 1000);
          }
          lastPlayed = i;
        }
        
        // Draw falling note
        const startY = canvas.height - (time - lapse) * (canvas.height / LOOK_AHEAD);
        const endY = canvas.height - (time + dur - lapse) * (canvas.height / LOOK_AHEAD);
        
        // Skip if completely off screen (above or below)
        if (startY < -100 || endY > canvas.height + 100) continue;
        
        const x = midiToX(midi);
        const w = noteWidth(midi) - 2;
        const h = Math.max(startY - endY, 4);
        const y = endY; // Don't clamp - let it go below screen
        
        // Light up key when note is playing
        if (time <= lapse && time + dur >= lapse) {
          keys[midi]?.classList.add('active');
        }
        
        // Draw note bar - brighter when hitting piano
        const isHitting = startY >= canvas.height - 5 && endY <= canvas.height;
        ctx.fillStyle = trackColors[trackNo % trackColors.length];
        if (bloom) {
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = isHitting ? 25 : 10;
        }
        if (isHitting) {
          ctx.fillStyle = '#fff';
        }
        ctx.beginPath();
        ctx.roundRect(x + 1, y, w, h, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    
    // Instruments
    const instruments = {
      fast: () => new FastPiano(),
      piano: () => new Piano(),
      wavetable: () => new WavetablePiano(),
      electric: () => new ElectricPiano(),
      harpsichord: () => new Harpsichord(),
      organ: () => new ChurchOrgan(),
      silent: () => new SilentPiano()
    };
    
    function switchInstrument(type) {
      instrument = instruments[type]();
      audioContext = instrument.ctx;
    }
    
    switchInstrument('fast');
    
    function loadMidi(file) {
      if (typeof playing !== 'undefined') player.pause();
      allNotes = [];
      lastPlayed = -1;
      particles.length = 0;
      
      MidiConvert.load(file, function(midi) {
        m = midi;
        midi.tracks.forEach((track, trackNo) => {
          track.notes.forEach(note => {
            allNotes.push({ ...note, trackNo });
          });
        });
        allNotes.sort((a, b) => a.time - b.time);
        duration = allNotes[allNotes.length - 1].time + allNotes[allNotes.length - 1].duration;
        player.init();
      });
    }
    
    player.init();
    loadMidi('rush_e_real.mid');
    render();
  </script>
</body>
</html>
